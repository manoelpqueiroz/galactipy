# Check GitHub Pages documentation at:
# https://docs.github.com/en/pages
{%- raw %}
name: 📖 Publish Documentation

on:
  push:
    # TODO Switch comment toggles to enable documentation publishing
    ignore-paths:
      - '**'
    # paths:
    #   - docs/**
    #   - zensical.toml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages-deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        name: 🐍 Set up Python
        with:
          python-version: "{% endraw %}{{ cookiecutter.minimal_python_version }}{% raw %}"

      - name: 💽 Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: 🫙 Set up cache
        uses: actions/cache@v5.0.3
        with:
          path: .venv
          key: venv-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('poetry.lock') }}

      - name: 📥 Install dependencies
        run: poetry sync

      - name: 🗒️ Build documentation
        run: invoke docs --clean

      - name: 📤 Upload documentation artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: 📰 Deploy GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
{%- endraw %}
