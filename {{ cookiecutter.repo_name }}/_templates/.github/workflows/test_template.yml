# Check GitHub Actions documentation at:
# https://github.com/marketplace/actions/pypi-publish

# UPDATEME to suit your project's workflow
{%- raw %}
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      upload-coverage:
        required: true
        type: boolean
{%- endraw %}{% if cookiecutter.coverage_service == 'codacy' %}{% raw %}
    secrets:
      codacy-token:
        required: false
{%- endraw %}{% endif %}{% raw %}

jobs:
  test:
    name: Repository Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: 🐍 Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: 💽 Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: 🫙 Set up cache
        uses: actions/cache@v5.0.3
        with:
          path: .venv
          key: venv-${{ inputs.python-version }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('poetry.lock') }}

      - name: 📥 Install dependencies
        run: |
          poetry install

      - name: ✒️ Run style checks
        run: |
          invoke codestyle --check
          invoke lint

      - name: ☑️ Run tests
        run: invoke test

      - name: 👮 Run safety checks
        run: invoke security

      - name: 📤 Upload Coverage to {% endraw %}{{ cookiecutter.__coverage_title }}{% raw %}
        if: ${{ inputs.upload-coverage }}
{%- endraw %}{% if cookiecutter.coverage_service == 'coveralls' %}
        uses: coverallsapp/github-action@v2.3.6
{%- else %}
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: {% raw %}${{ secrets.codacy-token }}{% endraw %}
          coverage-reports: coverage.xml
{%- endif %}
