[project.theme]
features = [
  "navigation.indexes",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "toc.follow",
  "content.code.copy",
  "content.footnote.tooltips",
]


[project.theme.font]
code = "Cascadia Code"


[project.theme.palette]
scheme = "slate"
primary = "orange"
accent = "teal"


[project.plugins.mkdocstrings.handlers.python]
paths = ["{{ cookiecutter.package_name }}"]


[project.plugins.mkdocstrings.handlers.python.options]
{%- if cookiecutter.docstring_style != 'other' %}
docstring_style = "{{ cookiecutter.docstring_style }}"
{%- else %}
# UPDATEME by setting the value for `docstring_style`, see documentation at:
# https://mkdocstrings.github.io/python/usage/
{%- endif %}
show_source = false
show_bases = false
inherited_members = false
filters = ["!^_"]

# Headings configuration
heading_level = 1
show_root_full_path = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true

# Docstring configuration
merge_init_into_class = true
docstring_options = { ignore_init_summary = true }
summary = true

# Signature configuration
line_length = {{ cookiecutter.docstring_length }}
separate_signature = true


[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"


[project.extra.tags]
Setup = "setup"
"For Your Information" = "default"
"Section Intros" = "default"
"User Guides" = "guide"
"Community Content" = "community"
Configuration = "config"
CLI = "cli"
TUI = "tui"
"Supporting Objects" = "aux"
Backend = "backend"
"Development Guides" = "dev"
"Design Definitions" = "design"
"Policies & Rules" = "policy"
Workflows = "workflow"
"Living Docs" = "default"

[project.theme.icon.tag]
setup = "lucide/tent-tree"
guide = "lucide/footprints"
community = "lucide/users"
config = "lucide/cog"
cli = "lucide/terminal"
tui = "lucide/scan-text"
aux = "lucide/life-buoy"
backend = "lucide/file-code-corner"
dev = "lucide/tool-case"
design = "lucide/layout-dashboard"
policy = "lucide/scroll-text"
workflow = "lucide/workflow"


[[project.extra.social]]
icon = "fontawesome/brands/{{ cookiecutter.__scm_platform_lc }}"
link = "{{ cookiecutter.__scm_repo_url }}"
name = "{{ cookiecutter.project_name }} development repository"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "{{ cookiecutter.__pypi_url }}"
name = "PyPI package page"
{%- if cookiecutter.create_docker %}

[[project.extra.social]]
{%- if cookiecutter.__scm_platform_lc == 'gitlab' %}
icon = "fontawesome/solid/box-open"
link = "{{ cookiecutter.__docker_repo }}"
name = "{{ cookiecutter.project_name }} Container Registry"
{%- else %}
icon = "fontawesome/brands/docker"
link = "{{ cookiecutter.__docker_repo }}"
name = "{{ cookiecutter.project_name }} is on Docker Hub!"
{%- endif %}
{%- endif %}
