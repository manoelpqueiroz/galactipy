  feature: ":milky_way: Components"
  features: ":milky_way: Components"
  expand: ":milky_way: Components"
  expansion: ":milky_way: Components"
  expansions: ":milky_way: Components"
  enhance: ":milky_way: Components"
  enhancement: ":milky_way: Components"
  enhancements: ":milky_way: Components"
  zero-config: ":milky_way: Components"
  zconf: ":milky_way: Components"

  template-config: ":metro: Components Configuration"
  tool-config: ":metro: Components Configuration"
  tool-behavior: ":metro: Components Configuration"
  tool-behaviour: ":metro: Components Configuration"
  docker: ":metro: Components Configuration"
  github: ":metro: Components Configuration"
  gitlab: ":metro: Components Configuration"
  ci-template: ":metro: Components Configuration"
  inv-template: ":metro: Components Configuration"
  invoke-template: ":metro: Components Configuration"
  renovate-template: ":metro: Components Configuration"
  pre-commit-template: ":metro: Components Configuration"

  opt: ":ballot_box: Settings & Options"
  opts: ":ballot_box: Settings & Options"
  option: ":ballot_box: Settings & Options"
  options: ":ballot_box: Settings & Options"
  setting: ":ballot_box: Settings & Options"
  settings: ":ballot_box: Settings & Options"
  pyproject: ":ballot_box: Settings & Options"
  zensical: ":ballot_box: Settings & Options"
  toml: ":ballot_box: Settings & Options"

  util: ":newspaper2: Utility Files"
  utils: ":newspaper2: Utility Files"
  utility: ":newspaper2: Utility Files"
  utilities: ":newspaper2: Utility Files"
  content: ":newspaper2: Utility Files"
  contents: ":newspaper2: Utility Files"
  template-documentation: ":newspaper2: Utility Files"
  template-doc: ":newspaper2: Utility Files"
  template-docs: ":newspaper2: Utility Files"
  template-policy: ":newspaper2: Utility Files"
  template-policies: ":newspaper2: Utility Files"

  # 2. Changes that impact users, but are not directly visible
  hook: ":hatching_chick: Template Generation"
  hooks: ":hatching_chick: Template Generation"
  cookiecutter: ":hatching_chick: Template Generation"
  cookiecutter-var: ":hatching_chick: Template Generation"
  cookiecutter-vars: ":hatching_chick: Template Generation"
  cookiecutter-variable: ":hatching_chick: Template Generation"
  cookiecutter-variables: ":hatching_chick: Template Generation"
  startup: ":hatching_chick: Template Generation"
  var: ":hatching_chick: Template Generation"
  vars: ":hatching_chick: Template Generation"
  jinja: ":hatching_chick: Template Generation"
  jinja-conditional: ":hatching_chick: Template Generation"
  jinja-conditionals: ":hatching_chick: Template Generation"

  refactor: ":factory_worker: Template Maintenance"
  refactors: ":factory_worker: Template Maintenance"
  refactoring: ":factory_worker: Template Maintenance"
  rework: ":factory_worker: Template Maintenance"
  reworks: ":factory_worker: Template Maintenance"
  reworking: ":factory_worker: Template Maintenance"
  reorg: ":factory_worker: Template Maintenance"
  reorganization: ":factory_worker: Template Maintenance"
  reorganisation: ":factory_worker: Template Maintenance"
  reorganize: ":factory_worker: Template Maintenance"
  reorganise: ":factory_worker: Template Maintenance"
  maintenance: ":factory_worker: Template Maintenance"
  template-dep: ":factory_worker: Template Maintenance"
  template-deps: ":factory_worker: Template Maintenance"

  bug: ":toolbox: Fixes"
  bugfix: ":toolbox: Fixes"
  fix: ":toolbox: Fixes"
  hotfix: ":toolbox: Fixes"
  patch: ":toolbox: Fixes"
  patches: ":toolbox: Fixes"
  patching: ":toolbox: Fixes"
  critical: ":toolbox: Fixes"

  # 3. Changes that are irrelevant to users
  project-config: ":gear: Project Internals"
  dev: ":gear: Project Internals"
  devx: ":gear: Project Internals"
  dependencies: ":gear: Project Internals"
  dep: ":gear: Project Internals"
  deps: ":gear: Project Internals"
  devdep: ":gear: Project Internals"
  devdeps: ":gear: Project Internals"

  ci: ":airplane_departure: Release Cycle Optimisation"
  invoke: ":airplane_departure: Release Cycle Optimisation"
  pre-commit: ":airplane_departure: Release Cycle Optimisation"
  renovate: ":airplane_departure: Release Cycle Optimisation"

  test: ":100: Template Cohesion"
  tests: ":100: Template Cohesion"
  testing: ":100: Template Cohesion"
  cov: ":100: Template Cohesion"
  coverage: ":100: Template Cohesion"
  regression: ":100: Template Cohesion"

  flag: ":pie: Features-in-waiting"
  flags: ":pie: Features-in-waiting"

  nit: ":pouring_liquid: Nits"
  nits: ":pouring_liquid: Nits"
  typo: ":pouring_liquid: Nits"
  typos: ":pouring_liquid: Nits"
  words: ":pouring_liquid: Nits"
  wording: ":pouring_liquid: Nits"
  layout: ":pouring_liquid: Nits"
  order: ":pouring_liquid: Nits"
  anchors: ":pouring_liquid: Nits"
  jinja-fix: ":pouring_liquid: Nits"
  rendering: ":pouring_liquid: Nits"
  markdown: ":pouring_liquid: Nits"

  # 4. Knowledge Management
  readme: ":frame_photo: Project Presentation"
  documentation: ":frame_photo: Project Presentation"
  doc: ":frame_photo: Project Presentation"
  docs: ":frame_photo: Project Presentation"

  policy: ":scroll: Project Policies"
  policies: ":scroll: Project Policies"
  rule: ":scroll: Project Policies"
  rules: ":scroll: Project Policies"
  milestone: ":scroll: Project Policies"
  milestones: ":scroll: Project Policies"
  epic: ":scroll: Project Policies"
  epics: ":scroll: Project Policies"
  roadmap: ":scroll: Project Policies"
  contributing: ":scroll: Project Policies"
  template: ":scroll: Project Policies"
  templates: ":scroll: Project Policies"
  templating: ":scroll: Project Policies"
template: |
  {% if categories %}
  {% each categories %}
  ### {{ title }} ({% if single_change %}1 change{% else %}{{ count }} changes{% end %})

  {% each entries %}
  - [{{ title }}]({{ commit.reference }})\
  {% if author.credit %} by {{ author.reference }}{% end %}\
  {% if commit.trailers.MR %} ([merge request]({{ commit.trailers.MR }}))\
  {% else %}\
  {% if merge_request %} ([merge request]({{ merge_request.reference }}))\
  {% end %}\
  {% end %}

  {% end %}

  {% end %}
  {% else %}
  No changes detailed for this release.
  {% end %}
